services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      QDRANT_URL: http://qdrant:6333
      CODE_REPOSITORY_PATH: /workspace/repository
      WIKI_ROOT_PATH: /data/wiki
      WIKI_SOURCE_PATH: /data/wiki-sources
      WIKI_DRAFT_PATH: /data/wiki-drafts
      VERSION_MANIFEST_ROOT_PATH: /data/version-manifests
      REQUIREMENT_SNAPSHOT_ROOT_PATH: /data/requirement-snapshots
      MCP_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:8088}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      BGE_RERANK_URL: ${BGE_RERANK_URL:-http://host.docker.internal:8081}
    volumes:
      - nexus_data:/data
      - nexus_repository:/workspace/repository:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  nexus_data:
  nexus_repository:
  qdrant_data:
  grafana_data:
