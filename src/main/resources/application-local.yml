# 本地开发档位：本地 Qdrant + OpenAI 兼容网关，适合开发和演示。
# 启用：SPRING_PROFILES_ACTIVE=local
app:
  rag:
    auth:
      # 本地开发：允许默认管理员；生产环境（production profile）为 fail-closed。
      default-admin-allowed: true

    qdrant:
      base-url: ${QDRANT_URL:http://localhost:6333}
    retrieval:
      llm-rerank-enabled: ${LLM_RERANK_ENABLED:true}
