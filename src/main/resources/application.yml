spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: NEXUS
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    model:
      chat: ${AI_MODEL_CHAT:openai}
      embedding: ${AI_MODEL_EMBEDDING:openai}
    mcp:
      server:
        enabled: ${MCP_ENABLED:true}
        name: nexus
        version: 0.8.6
        protocol: STREAMABLE
        instructions: Evidence-bound requirement, code, Wiki, and version knowledge for development agents.
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:http://ai-gateway.momo.com}
      chat:
        timeout:
          connect: ${OPENAI_CONNECT_TIMEOUT:10s}
          read: ${OPENAI_READ_TIMEOUT:300s}
        options:
          model: ${OPENAI_CHAT_MODEL:claude-sonnet-4.6}
      embedding:
        enabled: true
        # 网关经 VPN 隧道，连接可能间歇挂起：短超时 + 重试让请求快速失败重试，而非无限等待。
        timeout: ${OPENAI_EMBEDDING_READ_TIMEOUT:20s}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-v4}
          # 网关上游强制要求显式 encoding_format（缺失返回 400），显式 float 兼容标准 OpenAI 语义
          encoding-format: ${OPENAI_EMBEDDING_ENCODING_FORMAT:float}
    retry:
      max-attempts: ${OPENAI_RETRY_MAX_ATTEMPTS:5}
      backoff:
        initial-interval: ${OPENAI_RETRY_BACKOFF_MS:2000ms}
        multiplier: ${OPENAI_RETRY_BACKOFF_MULTIPLIER:2}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: false
      embedding:
        enabled: false
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

server:
  port: ${SERVER_PORT:8080}

webhook:
  secret: ${WEBHOOK_SECRET:}

logging:
  level:
    org.springframework.ai: INFO
  structured:
    format:
      console: ${STRUCTURED_LOG_FORMAT:logstash}

management:
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        rag.stage: true
        http.server.requests: true
      percentiles:
        rag.stage: 0.5,0.95,0.99

app:
  mcp:
    enabled: ${MCP_ENABLED:true}
    max-results: ${MCP_MAX_RESULTS:20}
    max-source-lines: ${MCP_MAX_SOURCE_LINES:200}
    max-excerpt-characters: ${MCP_MAX_EXCERPT_CHARACTERS:2000}
    max-evidence: ${MCP_MAX_EVIDENCE:40}
    max-response-characters: ${MCP_MAX_RESPONSE_CHARACTERS:120000}
  rag:
    code-graph-root-path: ${CODE_GRAPH_ROOT_PATH:data/code-graph}
    evolution:
      enabled: ${EVOLUTION_ENABLED:false}
      experience-recording-enabled: ${EVOLUTION_EXPERIENCE_RECORDING_ENABLED:false}
      success-sample-rate: ${EVOLUTION_SUCCESS_SAMPLE_RATE:0.1}
      failure-sample-rate: ${EVOLUTION_FAILURE_SAMPLE_RATE:1.0}
      queue-capacity: ${EVOLUTION_QUEUE_CAPACITY:1000}
      query-preview-enabled: ${EVOLUTION_QUERY_PREVIEW_ENABLED:false}
      retention-days: ${EVOLUTION_RETENTION_DAYS:30}
      experience-root-path: ${EVOLUTION_EXPERIENCE_ROOT_PATH:data/evolution/experiences}
      candidate-root-path: ${EVOLUTION_CANDIDATE_ROOT_PATH:data/evolution/candidates}
      dataset-root-path: ${EVOLUTION_DATASET_ROOT_PATH:data/evolution/datasets}
      policy-root-path: ${EVOLUTION_POLICY_ROOT_PATH:data/evolution/policies}
    qdrant:
      base-url: ${QDRANT_URL:http://localhost:6333}
      collection: ${QDRANT_COLLECTION:requirement_chunks}
    code:
      project-id: ${CODE_PROJECT_ID:default-project}
      repository-path: ${CODE_REPOSITORY_PATH:.}
      collection: ${CODE_QDRANT_COLLECTION:code_chunks}
      include-path-substrings: ${CODE_INCLUDE_PATH_SUBSTRINGS:}
      exclude-path-substrings:
        - /target/
        - /.git/
        - /node_modules/
        - /build/
      max-file-bytes: ${CODE_MAX_FILE_BYTES:1000000}
    bge:
      base-url: ${BGE_RERANK_URL:http://localhost:8081}
      path: ${BGE_RERANK_PATH:/rerank}
      api-key: ${BGE_RERANK_API_KEY:}
      connect-timeout-ms: ${BGE_RERANK_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${BGE_RERANK_READ_TIMEOUT_MS:10000}
    llm:
      generation-model: ${GENERATION_MODEL:claude-sonnet-4.6}
      development-plan-model: ${DEVELOPMENT_PLAN_MODEL:gpt-5.6-sol}
      doubt-review-model: ${DOUBT_REVIEW_MODEL:glm-5.2}
      reranker-model: ${LLM_RERANK_MODEL:claude-sonnet-5}
      routing-model: ${LLM_ROUTING_MODEL:}
      annotation-model: ${ANNOTATION_MODEL:claude-opus-5}
    retrieval:
      dense-top-k: 50
      sparse-top-k: 50
      hybrid-top-k: 40
      bge-top-k: 20
      llm-top-k: 10
      llm-rerank-enabled: ${LLM_RERANK_ENABLED:true}
      llm-rerank-skip-gap: ${LLM_RERANK_SKIP_GAP:0}
      branch-timeout-ms: ${RETRIEVAL_BRANCH_TIMEOUT_MS:5000}
      parallelism: ${RETRIEVAL_PARALLELISM:6}
      circuit-breaker-failure-threshold: ${RETRIEVAL_CIRCUIT_FAILURE_THRESHOLD:3}
      circuit-breaker-open-ms: ${RETRIEVAL_CIRCUIT_OPEN_MS:30000}
      result-cache-ttl-seconds: ${RETRIEVAL_CACHE_TTL_SECONDS:120}
      result-cache-max-entries: ${RETRIEVAL_CACHE_MAX_ENTRIES:1000}
      embedding-cache-ttl-seconds: ${EMBEDDING_CACHE_TTL_SECONDS:900}
      embedding-cache-max-entries: ${EMBEDDING_CACHE_MAX_ENTRIES:10000}
      code-bge-rerank-enabled: ${CODE_BGE_RERANK_ENABLED:false}
      code-candidate-multiplier: ${CODE_CANDIDATE_MULTIPLIER:3}
      code-exact-symbol-enabled: ${CODE_EXACT_SYMBOL_ENABLED:true}
      code-class-scoped-enabled: ${CODE_CLASS_SCOPED_ENABLED:true}
      code-structural-rerank-enabled: ${CODE_STRUCTURAL_RERANK_ENABLED:true}
    knowledge:
      bootstrap-enabled: ${KNOWLEDGE_BOOTSTRAP_ENABLED:false}
      zip-path: ${KNOWLEDGE_ZIP_PATH:}
      xlsx-path: ${KNOWLEDGE_XLSX_PATH:}
      document-id: ${KNOWLEDGE_DOCUMENT_ID:requirements}
      version: ${KNOWLEDGE_VERSION:}
      zip-folder-prefix: ${KNOWLEDGE_ZIP_FOLDER_PREFIX:}
      xlsx-sheet-prefix: ${KNOWLEDGE_XLSX_SHEET_PREFIX:}
      min-html-bytes: ${KNOWLEDGE_MIN_HTML_BYTES:800}
    wiki:
      root-path: ${WIKI_ROOT_PATH:data/wiki}
      source-path: ${WIKI_SOURCE_PATH:data/wiki-sources}
      draft-path: ${WIKI_DRAFT_PATH:data/wiki-drafts}
      cache-ttl-seconds: ${WIKI_CACHE_TTL_SECONDS:300}
      cache-max-entries: ${WIKI_CACHE_MAX_ENTRIES:2000}
    versioning:
      root-path: ${VERSION_MANIFEST_ROOT_PATH:data/version-manifests}
      requirement-snapshot-root-path: ${REQUIREMENT_SNAPSHOT_ROOT_PATH:data/requirement-snapshots}
    review:
      min-questions: ${REVIEW_MIN_QUESTIONS:12}
      max-questions: ${REVIEW_MAX_QUESTIONS:15}
      current-version-questions: ${REVIEW_CURRENT_VERSION_QUESTIONS:12}
      prior-version-questions: ${REVIEW_PRIOR_VERSION_QUESTIONS:3}
    auth:
      # 可信网关身份头名（如 X-Gateway-User）；为空表示不校验身份头。
      # 生产环境（application-production.yml）禁止默认管理员并应配置该头。
      identity-header: ${AUTH_IDENTITY_HEADER:}
      default-admin-allowed: ${AUTH_DEFAULT_ADMIN_ALLOWED:false}

    # 多项目注册表。为空时自动基于上方 knowledge/code 构造默认项目。
    # 每个项目独立 collection，互不干扰。
    projects:
      - id: ${PROJECT_1_ID:}
        name: ${PROJECT_1_NAME:}
        group: ${PROJECT_1_GROUP:}
        side: ${PROJECT_1_SIDE:server}
        requirement-collection: ${PROJECT_1_REQ_COLLECTION:}
        code-collection: ${PROJECT_1_CODE_COLLECTION:}
        repository-path: ${PROJECT_1_REPO_PATH:}
        git-path: ${PROJECT_1_GIT_PATH:}
        knowledge:
          bootstrap-enabled: ${PROJECT_1_BOOTSTRAP:false}
          zip-path: ${PROJECT_1_ZIP_PATH:}
          xlsx-path: ${PROJECT_1_XLSX_PATH:}
          document-id: ${PROJECT_1_DOC_ID:}
          version: ${PROJECT_1_VERSION:}
          zip-folder-prefix: ${PROJECT_1_ZIP_PREFIX:}
          xlsx-sheet-prefix: ${PROJECT_1_XLSX_PREFIX:}
          min-html-bytes: ${PROJECT_1_MIN_HTML:800}
