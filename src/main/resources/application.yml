spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: NEXUS
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:true}
        name: nexus
        version: 0.6.0
        protocol: STREAMABLE
        instructions: Evidence-bound requirement, code, Wiki, and version knowledge for development agents.
    chat:
      client:
        enabled: false
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:http://ai-gateway.momo.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:claude-sonnet-4.6}
      embedding:
        enabled: false
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: false
      embedding:
        enabled: true
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}

server:
  port: ${SERVER_PORT:8080}

webhook:
  secret: ${WEBHOOK_SECRET:}

logging:
  level:
    org.springframework.ai: INFO
  structured:
    format:
      console: ${STRUCTURED_LOG_FORMAT:logstash}

management:
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        rag.stage: true
        http.server.requests: true
      percentiles:
        rag.stage: 0.5,0.95,0.99

app:
  mcp:
    enabled: ${MCP_ENABLED:true}
    max-results: ${MCP_MAX_RESULTS:20}
    max-source-lines: ${MCP_MAX_SOURCE_LINES:200}
    max-excerpt-characters: ${MCP_MAX_EXCERPT_CHARACTERS:2000}
    max-evidence: ${MCP_MAX_EVIDENCE:40}
    max-response-characters: ${MCP_MAX_RESPONSE_CHARACTERS:120000}
  rag:
    qdrant:
      base-url: ${QDRANT_URL:http://localhost:6333}
      collection: ${QDRANT_COLLECTION:requirement_chunks}
    code:
      project-id: ${CODE_PROJECT_ID:default-project}
      repository-path: ${CODE_REPOSITORY_PATH:.}
      collection: ${CODE_QDRANT_COLLECTION:code_chunks}
      include-path-substrings: ${CODE_INCLUDE_PATH_SUBSTRINGS:}
      exclude-path-substrings:
        - /target/
        - /.git/
        - /node_modules/
        - /build/
      max-file-bytes: ${CODE_MAX_FILE_BYTES:1000000}
    bge:
      base-url: ${BGE_RERANK_URL:http://localhost:8081}
      path: ${BGE_RERANK_PATH:/rerank}
      api-key: ${BGE_RERANK_API_KEY:}
    llm:
      generation-model: ${GENERATION_MODEL:claude-sonnet-4.6}
      reranker-model: ${LLM_RERANK_MODEL:claude-haiku-4-5-20251001}
      routing-model: ${LLM_ROUTING_MODEL:}
    retrieval:
      dense-top-k: 50
      sparse-top-k: 50
      hybrid-top-k: 40
      bge-top-k: 20
      llm-top-k: 10
    knowledge:
      bootstrap-enabled: ${KNOWLEDGE_BOOTSTRAP_ENABLED:false}
      zip-path: ${KNOWLEDGE_ZIP_PATH:}
      xlsx-path: ${KNOWLEDGE_XLSX_PATH:}
      document-id: ${KNOWLEDGE_DOCUMENT_ID:requirements}
      version: ${KNOWLEDGE_VERSION:}
      zip-folder-prefix: ${KNOWLEDGE_ZIP_FOLDER_PREFIX:}
      xlsx-sheet-prefix: ${KNOWLEDGE_XLSX_SHEET_PREFIX:}
      min-html-bytes: ${KNOWLEDGE_MIN_HTML_BYTES:800}
    wiki:
      root-path: ${WIKI_ROOT_PATH:data/wiki}
      source-path: ${WIKI_SOURCE_PATH:data/wiki-sources}
      draft-path: ${WIKI_DRAFT_PATH:data/wiki-drafts}
    versioning:
      root-path: ${VERSION_MANIFEST_ROOT_PATH:data/version-manifests}
      requirement-snapshot-root-path: ${REQUIREMENT_SNAPSHOT_ROOT_PATH:data/requirement-snapshots}
    review:
      min-questions: ${REVIEW_MIN_QUESTIONS:12}
      max-questions: ${REVIEW_MAX_QUESTIONS:15}
      current-version-questions: ${REVIEW_CURRENT_VERSION_QUESTIONS:12}
      prior-version-questions: ${REVIEW_PRIOR_VERSION_QUESTIONS:3}
    auth:
      enabled: ${AUTH_ENABLED:true}
      users:
        - username: ${AUTH_USER_1_NAME:admin}
          api-key: ${AUTH_USER_1_KEY:}
          role: ${AUTH_USER_1_ROLE:SUPER_ADMIN}
          projects:
            - "*"
        # - username: ${AUTH_USER_2_NAME:developer}
        #   api-key: ${AUTH_USER_2_KEY:}
        #   role: ${AUTH_USER_2_ROLE:DEVELOPER}
        #   projects:
        #     - ${AUTH_USER_2_PROJECT:default-project}

    # 多项目注册表。为空时自动基于上方 knowledge/code 构造默认项目。
    # 每个项目独立 collection，互不干扰。
    projects:
      - id: ${PROJECT_1_ID:}
        name: ${PROJECT_1_NAME:}
        group: ${PROJECT_1_GROUP:}
        side: ${PROJECT_1_SIDE:server}
        requirement-collection: ${PROJECT_1_REQ_COLLECTION:}
        code-collection: ${PROJECT_1_CODE_COLLECTION:}
        repository-path: ${PROJECT_1_REPO_PATH:}
        git-path: ${PROJECT_1_GIT_PATH:}
        knowledge:
          bootstrap-enabled: ${PROJECT_1_BOOTSTRAP:false}
          zip-path: ${PROJECT_1_ZIP_PATH:}
          xlsx-path: ${PROJECT_1_XLSX_PATH:}
          document-id: ${PROJECT_1_DOC_ID:}
          version: ${PROJECT_1_VERSION:}
          zip-folder-prefix: ${PROJECT_1_ZIP_PREFIX:}
          xlsx-sheet-prefix: ${PROJECT_1_XLSX_PREFIX:}
          min-html-bytes: ${PROJECT_1_MIN_HTML:800}
