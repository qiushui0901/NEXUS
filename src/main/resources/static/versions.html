<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS · 版本中心</title>
  <link rel="stylesheet" href="/assets/design-tokens.css">
  <link rel="stylesheet" href="/assets/app-shell.css">
  <link rel="stylesheet" href="/assets/components.css">
  <link rel="stylesheet" href="/assets/responsive.css">
  <link rel="stylesheet" href="/assets/reading-workbench.css">
  <style>
    :root{--ink:#15231e;--muted:#68736e;--paper:#f4f0e7;--card:#fffdf7;--line:#d9d2c4;--green:#215d4b;--mint:#dceae2;--gold:#9b651e;--red:#a33e3e;--blue:#315c8a;--shadow:0 16px 45px rgba(31,43,36,.08)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.app{min-height:100vh}
    header{min-height:64px;padding:0 24px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:rgba(255,253,247,.94);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:baseline;gap:10px}.brand strong{font:700 22px Georgia,serif;letter-spacing:.08em}.brand span{color:var(--muted);font-size:12px}.header-spacer{flex:1}.header-link{color:var(--green);font-size:13px;font-weight:700;text-decoration:none}.api-key{width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:12px}
    .layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{padding:22px;border-right:1px solid var(--line);background:#eee9de}main{padding:30px clamp(20px,4vw,64px);min-width:0}.eyebrow{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.panel-title{margin:5px 0 16px;font:700 22px Georgia,serif}.field{display:grid;gap:6px;margin:0 0 14px}.field label{color:var(--muted);font-size:11px;font-weight:700}.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}.compare{width:100%;padding:10px 12px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}.compare:disabled{background:#9aaca3;cursor:not-allowed}.hint{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.timeline{display:grid;gap:8px;margin-top:22px}.timeline-item{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;color:var(--ink);cursor:pointer}.timeline-item:hover,.timeline-item.selected{border-color:var(--green);box-shadow:0 5px 16px rgba(30,50,40,.07)}.timeline-item strong,.timeline-item small{display:block}.timeline-item small{margin-top:4px;color:var(--muted);font-size:11px}.badge{display:inline-flex;padding:3px 7px;border-radius:999px;background:var(--mint);color:var(--green);font-size:10px;font-weight:800}.badge.DRAFT{background:#f3e6c8;color:#845817}.badge.REJECTED,.badge.FAILED,.badge.NOT_AVAILABLE{background:#f5dada;color:var(--red)}.badge.AVAILABLE,.badge.SUCCESS{background:var(--mint);color:var(--green)}
    .report-head{padding-bottom:20px;border-bottom:1px solid var(--line)}h1{margin:8px 0 10px;font:700 clamp(30px,5vw,56px)/1.04 Georgia,"Songti SC",serif;letter-spacing:-.025em}.summary{max-width:820px;color:#445049;line-height:1.7}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.meta-pill{padding:6px 9px;border-radius:999px;background:#eae4d8;color:#53605a;font-size:11px}.warnings{display:grid;gap:8px;margin:18px 0}.warning{padding:11px 13px;border-left:4px solid var(--gold);border-radius:0 10px 10px 0;background:#fbf2df;color:#634616;font-size:13px;line-height:1.55}.tabs{display:flex;gap:4px;overflow-x:auto;margin:22px 0 18px;border-bottom:1px solid var(--line)}.tab{padding:10px 13px;white-space:nowrap;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer}.tab.active{border-color:var(--green);color:var(--green);font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:16px}.stat,.section,.empty{border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:var(--shadow)}.stat{padding:13px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;margin-top:4px;font:700 24px Georgia,serif}.section{padding:17px 19px;margin-bottom:13px}.section h2{margin:0 0 11px;font:700 19px Georgia,serif}.section h3{margin:0 0 7px;font-size:14px}.section p{margin:6px 0;color:#46524b;font-size:13px;line-height:1.6}.detail-list{display:grid;gap:10px}.change{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.change-head{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}.change-head code{font-size:11px;word-break:break-all}.change-meta{color:var(--muted);font-size:11px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.excerpt{margin:0;padding:10px;overflow:auto;border-radius:9px;background:#f7f3eb;color:#48534d;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.excerpt.before{border-left:3px solid var(--gold)}.excerpt.after{border-left:3px solid var(--green)}.empty{padding:36px 18px;color:var(--muted);text-align:center;line-height:1.65}.availability{margin:0 0 12px;color:var(--muted);font-size:12px}.wiki-link{display:inline-block;margin-top:10px;color:var(--green);font-weight:800;font-size:13px;text-decoration:none}.statusbar{position:fixed;right:18px;bottom:18px;padding:10px 12px;border-radius:11px;background:#173c31;color:#fff;font-size:12px;box-shadow:var(--shadow)}
    @media(max-width:900px){.layout{grid-template-columns:250px minmax(0,1fr)}.cards{grid-template-columns:repeat(2,minmax(120px,1fr))}}@media(max-width:680px){header{height:auto;padding:12px 16px;flex-wrap:wrap}.api-key{display:none}.header-spacer{display:none}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}main{padding:24px 16px}.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body class="versions-page">
<div data-nexus-shell data-page="versions"></div>
<div class="app">
  <div class="layout">
    <aside>
      <div class="eyebrow">Version timeline</div><div class="panel-title">选择比较范围</div>
      <div class="field"><label for="projectSelect">项目</label><select id="projectSelect" aria-label="项目"></select></div>
      <div class="field"><label for="fromVersionSelect">起始版本</label><select id="fromVersionSelect" aria-label="起始版本"></select></div>
      <div class="field"><label for="toVersionSelect">目标版本</label><select id="toVersionSelect" aria-label="目标版本"></select></div>
      <button id="compare" class="compare" type="button">比较两个版本</button>
      <p id="selectionHint" class="hint">正在读取可访问项目和版本档案…</p>
      <div id="timeline" class="timeline" aria-label="版本时间线"></div>
    </aside>
    <main id="main"><div class="empty">正在加载版本中心…</div></main>
  </div>
</div>
<script src="/assets/error-normalizer.js"></script>
<script src="/assets/api-client.js"></script>
<script src="/assets/app-shell.js"></script>
<script>
const state={projects:[],manifests:[],projectId:'',fromVersion:'',toVersion:'',report:null,activeTab:'requirements'};
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const params=values=>new URLSearchParams(values).toString();
const labels={ADDED:'新增',MODIFIED:'修改',REMOVED:'删除',RENAMED:'重命名',AVAILABLE:'可用',NOT_AVAILABLE:'不可用',SUCCESS:'成功',DRAFT:'草稿',PUBLISHED:'已发布',FAILED:'失败',SKIPPED:'跳过',PASSED:'通过'};
function headers(){return{}}
async function api(path,options={}){return NexusApi.request(path,{...options,headers:{...headers(),...(options.headers||{})}})}
function notice(text){NexusNotice.show(text,'info')}
function optionHtml(values,selected){return values.map(value=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(value)}</option>`).join('')}
function manifestFor(version){return state.manifests.find(item=>item.version===version)}
function defaultVersions(){const target=state.manifests[0];if(!target)return {from:'',to:''};const base=state.manifests.find(item=>item.codeCommit&&item.codeCommit===target.baseCodeCommit);const fallback=state.manifests.find(item=>item.version!==target.version);return {to:target.version,from:base?.version||fallback?.version||''};}
function setSelectors(){const versions=state.manifests.map(item=>item.version);const defaults=defaultVersions();if(!versions.includes(state.toVersion))state.toVersion=defaults.to;if(!versions.includes(state.fromVersion)||state.fromVersion===state.toVersion)state.fromVersion=defaults.from;$('fromVersionSelect').innerHTML=optionHtml(versions,state.fromVersion);$('toVersionSelect').innerHTML=optionHtml(versions,state.toVersion);const valid=versions.length>1&&state.fromVersion&&state.toVersion&&state.fromVersion!==state.toVersion;$('compare').disabled=!valid;$('selectionHint').textContent=valid?'可比较需求、代码、测试和 Wiki 四类差异。':'至少需要两个不同的 Wiki 版本，才能开始比较。'}
function renderTimeline(){const selected=state.toVersion;$('timeline').innerHTML=state.manifests.length?state.manifests.map(version=>{const pages=version.pages||[];const base=state.manifests.find(item=>item.codeCommit&&item.codeCommit===version.baseCodeCommit);return `<button type="button" class="timeline-item ${version.version===selected?'selected':''}" data-version="${esc(version.version)}"><strong>版本 ${esc(version.version)}</strong><span class="badge AVAILABLE">已生成 Wiki</span><small>${pages.length} 个页面 · 基准：${esc(base?.version||version.baseCodeCommit||'-')} · commit：${esc((version.codeCommit||'-').slice(0,12))}</small></button>`}).join(''):'<div class="empty">这个项目还没有可浏览的 Wiki 版本。</div>';$('timeline').querySelectorAll('[data-version]').forEach(item=>item.onclick=()=>{state.toVersion=item.dataset.version;if(state.fromVersion===state.toVersion)state.fromVersion=defaultVersions().from;setSelectors();renderTimeline();loadComparison()})}
async function loadProjects(){state.projects=await api('/api/wiki/projects');$('projectSelect').innerHTML=state.projects.map(project=>`<option value="${esc(project.projectId)}">${esc(project.projectName||project.projectId)}</option>`).join('');if(!state.projects.length){$('main').innerHTML='<div class="empty">当前账号还没有可访问的项目。请先准备项目 Wiki 或确认访问权限。</div>';$('selectionHint').textContent='没有可用于版本中心的项目。';return}state.projectId=$('projectSelect').value;await loadManifests()}
async function loadManifests(){state.projectId=$('projectSelect').value;state.report=null;state.manifests=await api('/api/wiki/versions?'+params({projectId:state.projectId}));state.fromVersion='';state.toVersion='';setSelectors();renderTimeline();if(state.manifests.length<2){$('main').innerHTML='<div class="empty">该项目的 Wiki 版本不足两个。先生成至少两个版本的实质性 Wiki 内容后，即可在这里浏览差异。</div>';return}await loadComparison()}
function availability(source,unavailableText){if(source?.availability==='AVAILABLE')return `<p class="availability"><span class="badge AVAILABLE">可用</span> 已读取该来源的结构化差异。</p>`;return `<div class="warning"><strong>来源不可用：</strong>${esc(unavailableText)}</div>`}
function stats(values){return `<div class="cards">${values.map(([label,value])=>`<div class="stat"><small>${esc(label)}</small><strong>${esc(value??0)}</strong></div>`).join('')}</div>`}
function changeLabel(type){return labels[type]||type||'变更'}
function renderRequirements(source){const changes=source?.changes||[];return availability(source,'需求版本内容未完整可读，不能将其视为没有变化。')+stats([['新增',source?.added],['修改',source?.modified],['删除',source?.removed]])+(changes.length?`<div class="detail-list">${changes.map(item=>`<article class="change"><div class="change-head"><span class="badge ${esc(item.type)}">${esc(changeLabel(item.type))}</span><code>${esc(item.filename||'-')}</code></div><p class="change-meta">父块：${esc(item.parentId||'-')} · 位置：${esc(item.parentOrder??'-')}</p><div class="columns"><div><h3>变更前</h3><pre class="excerpt before">${esc(item.beforeExcerpt||'—')}</pre></div><div><h3>变更后</h3><pre class="excerpt after">${esc(item.afterExcerpt||'—')}</pre></div></div></article>`).join('')}</div>`:'<div class="empty">没有可展示的需求块变更。</div>')}
function renderCode(source){const changes=source?.changes||[];return availability(source,'无法取得可信 Git 比较结果，不能将其视为没有代码变化。')+stats([['变更文件',source?.changedFiles],['新增',source?.added],['修改',source?.modified],['删除',source?.deleted],['重命名',source?.renamed],['Java 文件',source?.javaFiles],['测试文件',source?.testFiles],['配置文件',source?.configFiles]])+(changes.length?`<div class="detail-list">${changes.map(item=>{const path=item.status==='RENAMED'?`${item.oldPath||'-'} → ${item.newPath||'-'}`:(item.newPath||item.oldPath||'-');return `<article class="change"><div class="change-head"><span class="badge ${esc(item.status)}">${esc(changeLabel(item.status))}</span><code>${esc(path)}</code></div></article>`}).join('')}</div>`:'<div class="empty">没有可展示的代码文件变更。</div>')}
function renderTests(source){const cases=source?.cases||[];const unavailable=source?.availability!=='AVAILABLE';return availability(source,'没有真实执行快照，因此不能展示测试执行结论。')+(unavailable?'<div class="empty">没有真实执行快照。请在版本档案中记录真实测试执行结果后再进行比较。</div>':stats([['总数变化',source.totalDelta],['通过变化',source.passedDelta],['失败变化',source.failedDelta],['跳过变化',source.skippedDelta]])+`<section class="section"><h2>执行快照</h2><p>起始版本：${esc(source.beforeStatus||'-')}　→　目标版本：${esc(source.afterStatus||'-')}</p></section>`+(cases.length?`<div class="detail-list">${cases.map(item=>`<article class="change"><div class="change-head"><span class="badge ${esc(item.type)}">${esc(changeLabel(item.type))}</span><code>${esc(item.caseId||'-')}</code></div><p>${esc(item.name||'-')}</p><p class="change-meta">${esc(item.beforeStatus||'—')} → ${esc(item.afterStatus||'—')}</p></article>`).join('')}</div>`:'<div class="empty">真实快照存在，但没有可展示的用例级变化。</div>'))}
function renderWiki(source){const pages=source?.pages||[];return availability(source,'目标或起始版本的 Wiki 索引缺失，其他来源的差异仍可使用。')+stats([['新增',source?.added],['修改',source?.modified],['删除',source?.removed]])+(pages.length?`<div class="detail-list">${pages.map(item=>{const version=item.type==='REMOVED'?state.report.fromVersion:state.report.toVersion;const link='/wiki?'+params({projectId:state.report.projectId,version,featureId:item.featureId});return `<article class="change"><div class="change-head"><span class="badge ${esc(item.type)}">${esc(changeLabel(item.type))}</span><code>${esc(item.title||item.featureId||'-')}</code></div><p>状态：${esc(item.beforeStatus||'—')} → ${esc(item.afterStatus||'—')}　·　证据变化：${esc(item.evidenceDelta??0)}　·　摘要${item.summaryChanged?'已变化':'未变化'}</p><a class="wiki-link" href="${esc(link)}">在 Wiki 中查看</a></article>`}).join('')}</div>`:'<div class="empty">没有可展示的 Wiki 页面变更。</div>')}
function renderReport(){const report=state.report;if(!report)return;$('main').innerHTML=`<section class="report-head"><div class="eyebrow">Comparison report</div><h1>${esc(report.fromVersion)} → ${esc(report.toVersion)}</h1><p class="summary">同一项目的需求、代码、测试和 Wiki 以独立来源呈现；任一来源缺失时不会伪装成“没有变化”。</p><div class="meta"><span class="meta-pill">项目 ${esc(report.projectId)}</span><span class="meta-pill">生成于 ${esc(report.generatedAt||'-')}</span></div></section>${(report.warnings||[]).length?`<section class="warnings">${report.warnings.map(warning=>`<div class="warning">${esc(warning.code?`${warning.code}：`: '')}${esc(warning.message||warning)}</div>`).join('')}</section>`:''}<nav class="tabs">${[['requirements','需求变化'],['code','代码变化'],['tests','测试变化'],['wiki','Wiki 变化']].map(([id,label])=>`<button class="tab ${state.activeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</nav><section id="tabContent"></section>`;$('main').querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{state.activeTab=button.dataset.tab;renderReport()});const content=$('tabContent');const source={requirements:report.requirements,code:report.code,tests:report.tests,wiki:report.wiki}[state.activeTab];content.innerHTML=state.activeTab==='requirements'?renderRequirements(source):state.activeTab==='code'?renderCode(source):state.activeTab==='tests'?renderTests(source):renderWiki(source)}
async function loadComparison(){if(!state.fromVersion||!state.toVersion||state.fromVersion===state.toVersion)return;state.activeTab='requirements';$('main').innerHTML='<div class="empty">正在汇总四类版本差异…</div>';try{state.report=await api('/api/versions/compare?'+params({projectId:state.projectId,fromVersion:state.fromVersion,toVersion:state.toVersion}));renderReport()}catch(error){$('main').innerHTML=`<div class="empty">${esc(error.message)}</div>`;notice(error.message)}}
$('projectSelect').onchange=loadManifests;$('fromVersionSelect').onchange=event=>{state.fromVersion=event.target.value;setSelectors();loadComparison()};$('toVersionSelect').onchange=event=>{state.toVersion=event.target.value;setSelectors();renderTimeline();loadComparison()};$('compare').onclick=loadComparison;
loadProjects().catch(error=>{const safe=NexusErrors.normalize(error,'版本中心加载失败');$('main').innerHTML=`<div class="empty">${esc(safe.message)}<br>${esc(safe.action)}</div>`;NexusNotice.show(safe.message,'error')});
</script>
</body>
</html>
