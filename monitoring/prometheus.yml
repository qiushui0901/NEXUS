global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: requirement-rag
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:6333"]
